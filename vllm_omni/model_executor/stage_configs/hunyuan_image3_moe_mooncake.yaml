# Stage config for running Hunyuan-Image3.0 with AR→DiT KV reuse via D2D RDMA.
# Stage 0: AR Model (vLLM implementation)
# Stage 1: DiT Model (diffusion)
#
# text-to-image flow: AR (stage 0) → D2D RDMA KV transfer → DiT (stage 1)
#
# Uses MooncakeTransferEngineConnector in P2P handshake mode — no intermediate
# metadata server required, just direct device-to-device RDMA transfer.
#
# Optional env: RDMA_DEVICE_NAME (e.g. "mlx5_0") to pin a specific NIC.
#
# The following config has been verified on 8x L40S-48G GPU (4 for AR + 4 for DiT).

stage_args:
  - stage_id: 0
    stage_type: llm
    prompt_expand_func: vllm_omni.model_executor.stage_input_processors.hunyuan_image3.expand_cfg_prompts
    runtime:
      process: true
      devices: "0,1,2,3"
    engine_args:
      model_stage: AR
      max_num_seqs: 2
      model_arch: HunyuanImage3ForCausalMM
      worker_cls: vllm_omni.worker.gpu_ar_worker.GPUARWorker
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.9
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      hf_overrides:
        rope_parameters:
          mrope_section: [0, 32, 32]
          rope_type: default
      omni_kv_config:
        need_send_cache: true
    is_comprehension: true
    final_output: true
    final_output_type: text
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1
    output_connectors:
      to_stage_1: rdma_connector

  - stage_id: 1
    stage_type: diffusion
    cfg_kv_collect_func: vllm_omni.model_executor.stage_input_processors.hunyuan_image3.collect_cfg_kv_caches
    runtime:
      process: true
      devices: "4,5,6,7"
      max_batch_size: 1
    engine_args:
      model_stage: diffusion
      enforce_eager: true
      distributed_executor_backend: "mp"
      vae_use_slicing: false
      vae_use_tiling: false
      cache_backend: null
      cache_config: null
      enable_cache_dit_summary: false
      omni_kv_config:
        need_recv_cache: true
      parallel_config:
        pipeline_parallel_size: 1
        data_parallel_size: 1
        tensor_parallel_size: 4
        enable_expert_parallel: false
        sequence_parallel_size: 1
        ulysses_degree: 1
        ring_degree: 1
        cfg_parallel_size: 1
        vae_patch_parallel_size: 1
        use_hsdp: false
        hsdp_shard_size: -1
        hsdp_replicate_size: 1
    engine_input_source: [0]
    final_output: true
    final_output_type: image
    input_connectors:
      from_stage_0: rdma_connector

# Top-level runtime config with D2D RDMA connector
runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    rdma_connector:
      name: MooncakeTransferEngineConnector
      extra:
        host: "auto"               # auto-detect local IP for RDMA
        zmq_port: 50051             # ZMQ handshake port
        protocol: "rdma"            # "rdma" for RDMA NIC, "tcp" for fallback
        device_name: ""             # e.g. "mlx5_0" to pin NIC, or "" for auto
        memory_pool_size: 4294967296  # 4 GB registered memory pool
        memory_pool_device: "cpu"   # "cpu" (pinned) or "cuda" (GPUDirect RDMA)

  edges:
    - from: 0
      to: 1
      window_size: -1
